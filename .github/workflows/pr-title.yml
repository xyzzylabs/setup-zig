name: pr-title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  semantic:
    name: Semantic PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Lint PR title against Conventional Commits
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            deps
            build
            ci
            test
            chore
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The PR title subject should start with a lower-case letter, e.g.
            "feat: add Mach version resolver" — not "feat: Add Mach version resolver".
