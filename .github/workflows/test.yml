name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npm run typecheck
      - name: Run unit tests with coverage
        run: |
          node --test --experimental-test-coverage --test-reporter=spec 'test/*.test.ts' \
            2> >(tee test-stderr.log >&2) | tee test-stdout.log
      - name: Publish coverage to job summary
        if: always()
        shell: bash
        run: |
          if [ -f test-stdout.log ]; then
            {
              echo '### Test coverage'
              echo ''
              echo '```'
              awk '/^# (start of coverage|---+|file\s)/,/^# end of coverage/' test-stdout.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Rebuild dist/
        run: npm run build
      - name: Fail if committed dist/ is out of date
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "dist/ differs from the committed bundle. Run \`npm run build\` locally and commit."
            git --no-pager diff -- dist/ | head -200
            exit 1
          fi

  test-from-project:
    name: Resolve from build.zig.zon
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Create build.zig.zon fixture
        run: |
          cat >build.zig.zon <<'EOF'
          .{
              .name = "test-project",
              .version = "0.0.0",
              .minimum_zig_version = "0.13.0",
              .paths = .{""},
              .fingerprint = 0x43eaf07faceda5c3,
          }
          EOF
      - name: Set up Zig
        id: setup
        uses: ./
      - name: Verify zig-version output
        env:
          OUTPUT_VERSION: ${{ steps.setup.outputs.zig-version }}
        run: |
          if [ "$OUTPUT_VERSION" != "0.13.0" ]; then
            echo "zig-version output mismatch: expected 0.13.0, got '$OUTPUT_VERSION'"
            exit 1
          fi
      - name: Check installed Zig version
        run: |
          if [ "$(zig version)" != '0.13.0' ]; then
            echo "version mismatch: expected '0.13.0', got '$(zig version)'"
            exit 1
          fi

  test-version-file:
    name: Resolve from zig-version-file
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create .zigversion fixture
        run: echo '0.13.0' > .zigversion
      - name: Set up Zig
        uses: ./
        with:
          zig-version-file: .zigversion
      - name: Check installed Zig version
        run: |
          if [ "$(zig version)" != '0.13.0' ]; then
            echo "version mismatch: expected '0.13.0', got '$(zig version)'"
            exit 1
          fi

  test:
    name: smoke test (${{ matrix.os }}, ${{ matrix.zig_version }})
    needs: check
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig_version:
          - 'master'
          - 'latest'
          - '2024.5.0-mach'
          - '0.14.0'
          - '0.14.1'  # zig-linux-x86_64 -> zig-x86_64-linux
          - '0.15.0'
          - '0.15.1'  # armv7a -> arm
          - '0.16.0'  # current stable; keep pinned so coverage survives the next release
        # `macos-latest` is now macOS 26 (Tahoe). Every Zig release before
        # 0.16.0 ships a bundled compiler-rt whose macOS availability stubs
        # reference `__availability_version_check`, a symbol the linker on the
        # macOS 26 SDK no longer resolves — the link then fails with "undefined
        # symbol: __availability_version_check" (plus _abort, _malloc_size,
        # _sigaction, …). Only 0.16.0 / latest / master link on that SDK. Run
        # the affected legacy versions on `macos-14`, whose older SDK still
        # exports that symbol, so we keep real macOS coverage instead of
        # dropping it. (macos-13 is retired; 2024.5.0-mach resolves to a
        # 0.13.0-dev build and is affected too.)
        exclude:
          - os: macos-latest
            zig_version: '2024.5.0-mach'
          - os: macos-latest
            zig_version: '0.14.0'
          - os: macos-latest
            zig_version: '0.14.1'
          - os: macos-latest
            zig_version: '0.15.0'
          - os: macos-latest
            zig_version: '0.15.1'
        include:
          - os: macos-14
            zig_version: '2024.5.0-mach'
          - os: macos-14
            zig_version: '0.14.0'
          - os: macos-14
            zig_version: '0.14.1'
          - os: macos-14
            zig_version: '0.15.0'
          - os: macos-14
            zig_version: '0.15.1'
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Set up Zig
        uses: ./
        with: { version: '${{ matrix.zig_version }}' }
      - name: Smoke-test the installed Zig
        shell: bash
        run: |
          # Verify Zig is on PATH, reports a version, and can compile + run
          # a tiny self-contained test program. We do NOT rely on
          # `zig init`'s template here — that template has occasionally
          # shipped broken across releases (e.g. 0.16.0's `init` parameter
          # shadowing), and a template bug would falsely fail this matrix.
          zig version
          cat >smoke.zig <<'EOF'
          const std = @import("std");
          test "two plus two" {
              try std.testing.expect(2 + 2 == 4);
          }
          EOF
          zig test smoke.zig
